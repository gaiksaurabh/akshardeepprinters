<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinak Creative Co. Cost Estimation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html,
        body {
            min-height: 100%;
            height: auto;
            margin: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1a253c;
            margin-bottom: 1rem;
            flex-shrink: 0;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem;
            background-color: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
            margin-bottom: 1.5rem;
        }

        .customer-info-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem;
            flex-grow: 1;
        }

        .customer-info-bar .form-group {
            flex-grow: 1;
            min-width: 180px;
            margin-bottom: 0;
        }

        .customer-info-bar .form-group.small-input {
            flex-grow: 0;
            min-width: 120px;
            width: 120px;
        }

        .action-total-bar {
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
            margin-left: auto;
        }

        .total-display-top {
            text-align: right;
            min-width: 180px;
            margin-left: auto;
        }

        .total-display-top .total-label {
            font-size: 1rem;
            margin: 0 0 0.25rem 0;
            opacity: 0.9;
            color: #495057;
            font-weight: 500;
        }

        .total-display-top .total-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            color: #1a253c;
        }

        .total-header-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: flex-end;
        }

        .icon-btn {
            background: #f0f4f8;
            border: 1px solid #ced4da;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s, transform 0.08s;
        }

        .icon-btn:hover {
            background: #e2e6ea;
            transform: translateY(-1px);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
        }

        .icon-group {
            display: flex;
            gap: 1rem;
        }

        .sections-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .section {
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
        }

        .section-title-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.3rem;
            color: #0066cc;
            margin: 0;
            font-weight: 600;
        }

        .utility-btn {
            background: #e7f5ff;
            border: 1px solid #99cfff;
            color: #0066cc;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .utility-btn:hover {
            background: #d0ebff;
            border-color: #66b3ff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem 1.5rem;
        }

        .form-grid-single-col {
            grid-template-columns: 1fr;
        }

        .grid-col-span-2 {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .form-group label,
        .label-with-checkbox {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #495057;
            font-size: 0.9rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        select optgroup {
            font-weight: 600;
            color: #333;
            background: #eee;
        }

        .input-with-checkboxes {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .checkbox-stack {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            padding-bottom: 0.4rem;
        }

        .inline-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .inline-checkbox input {
            width: auto;
        }

        .inline-checkbox label {
            margin: 0;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .label-with-checkbox {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #1a253c;
            font-weight: 600;
        }



        #weight-calculator-result {
            margin-top: 1.5rem;
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            background-color: #f0f4f8;
            border: 1px solid #d1d9e6;
        }

        #weight-calculator-result p {
            margin: 0;
        }

        #weight-calculator-result .result-label {
            font-size: 0.9rem;
            color: #495057;
        }

        #weight-calculator-result .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a253c;
        }

        @media (max-width: 1200px) {
            .sections-wrapper {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }

            .container {
                max-width: 100%;
            }

            .section {
                padding: 1rem;
                margin-bottom: 0.5rem;
            }

            .top-bar {
                display: flex;
                flex-direction: column;
                gap: 0.8rem;
                background-color: transparent;
                padding: 0;
                box-shadow: none;
                border-radius: 0;
                margin-bottom: 0.8rem;
            }

            .customer-info-bar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
                background-color: #ffffff;
                padding: 1rem;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
                width: 100%;
                box-sizing: border-box;
            }

            .customer-info-bar .form-group {
                grid-column: span 2;
            }

            .customer-info-bar .form-group.small-input {
                grid-column: span 1;
            }

            .action-total-bar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
                padding: 1rem;
                background-color: #ffffff;
                border-radius: 12px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
                position: sticky;
                top: 0.5rem;
                z-index: 100;
                width: 100%;
                box-sizing: border-box;
                border: 1px solid #e2e8f0;
            }

            .total-display-top {
                grid-column: span 1;
                margin-left: 0;
                text-align: left;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .total-display-top .total-value {
                font-size: 1.8rem;
            }

            .total-header-row {
                justify-content: flex-start;
            }

            .icon-group {
                grid-column: span 1;
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 0.5rem;
            }

            .icon-btn {
                width: 44px;
                height: 44px;
                flex: none;
            }

            .modal-content {
                padding: 1.2rem;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            /* Make sure span elements only take 1 column on narrow screens */
            .form-grid>.grid-col-span-2,
            .form-grid>.form-group {
                grid-column: span 1 !important;
            }
        }
    </style>
</head>

<body>
    <div id="modal-container"></div>
    <div class="container">
        <h1>Pinak Creative Co. Cost Estimation</h1>
        <div class="top-bar">
            <div class="customer-info-bar">
                <div class="form-group">
                    <label for="customer-name">Customer Name</label>
                    <input type="text" id="customer-name" placeholder="Enter customer name...">
                </div>
                <div class="form-group">
                    <label for="customer-address">Address</label>
                    <input type="text" id="customer-address" placeholder="Enter customer address...">
                </div>
                <div class="form-group">
                    <label for="customer-phone">Phone</label>
                    <input type="text" id="customer-phone" placeholder="Enter customer phone...">
                </div>
                <div class="form-group">
                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" placeholder="e.g., Letterheads">
                </div>

                <div class="form-group small-input">
                    <label for="delivery-charges">Delivery Charges (₹)</label>
                    <input type="number" id="delivery-charges" value="0" min="0">
                </div>
                <div class="form-group small-input">
                    <label for="profit-input">Profit (%)</label>
                    <input type="number" id="profit-input" value="0" min="0">
                </div>
            </div>

            <div class="action-total-bar">
                <div class="total-display-top">
                    <div class="total-header-row">
                        <h3 class="total-label" style="margin: 0;">Total</h3>
                        <div class="inline-checkbox" style="display: flex; align-items: center; gap: 0.25rem;">
                            <input type="checkbox" id="tax-rate-check" checked
                                style="width: 14px; height: 14px; margin: 0; accent-color: #8b2635; cursor: pointer;">
                            <label for="tax-rate-check"
                                style="margin: 0; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: #495057; user-select: none;">18%
                                GST</label>
                        </div>
                    </div>
                    <p class="total-value" id="total-cost">₹ 0.00</p>
                </div>

                <div class="icon-group">
                    <button id="download-pdf-btn" class="icon-btn" title="Download Quote PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                        </svg>
                    </button>
                    <button id="copy-quotation-btn" class="icon-btn" title="Copy Quotation to Clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                        </svg>
                    </button>
                    <button id="whatsapp-btn" class="icon-btn" title="Send to WhatsApp">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="#25D366">
                            <path
                                d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.8 0-67.6-9.5-97.8-26.7l-7-4.1-72.5 19.1 19.4-70.5-4.5-7.3c-18.4-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="sections-wrapper">
            <div class="section">
                <div class="section-title-container">
                    <h2 class="section-title">1. Printing</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group grid-col-span-2">
                        <label for="plate-size">Plate Size</label>
                        <select id="plate-size">
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="job-size">Job Size</label>
                        <select id="job-size">
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="actual-quantity">Actual Quantity</label>
                        <input type="number" id="actual-quantity" value="1000" min="1" placeholder="e.g., 1000">
                    </div>
                    <div class="form-group"><label for="printing-gsm-select">GSM</label><select
                            id="printing-gsm-select"></select></div>
                    <div class="form-group">
                        <label for="quantity">Actual Printing Quantity</label>
                        <div class="input-with-checkboxes">
                            <input type="number" id="quantity" placeholder="e.g., 2000" style="flex-grow:1; margin:0;">
                            <div class="checkbox-stack">
                                <div class="inline-checkbox"><input type="checkbox" id="fb-check"><label
                                        for="fb-check">F/B</label></div>
                                <div class="inline-checkbox"><input type="checkbox" id="form-check"><label
                                        for="form-check">Form</label></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="label-with-checkbox">
                            <label for="printing-cost" style="margin:0;">Printing Cost (₹)</label>
                            <div class="inline-checkbox"><input type="checkbox" id="without-plate-check"><label
                                    for="without-plate-check">Without Plate</label></div>
                        </div>
                        <input type="number" class="cost-input" id="printing-cost" placeholder=""
                            data-label="Printing Cost">
                    </div>
                    <div class="form-group"><label for="second-cost">Second (₹)</label><input type="number"
                            class="cost-input" id="second-cost" placeholder="" data-label="Second Printing"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title-container">
                    <h2 class="section-title">2. Paper</h2>
                    <button id="open-weight-calculator-btn" class="utility-btn">Weight Calculator</button>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label for="paper-size-select">Paper Size</label><select
                            id="paper-size-select"></select></div>
                    <div class="form-group"><label for="paper-gsm-select">Paper GSM</label><select
                            id="paper-gsm-select"></select></div>
                    <div class="form-group"><label for="paper-sheets-input">No. of Sheets</label><input type="number"
                            id="paper-sheets-input" placeholder="0"></div>
                    <div class="form-group"><label for="paper-rate-input">Rate per kg (₹)</label><input type="number"
                            id="paper-rate-input" placeholder="e.g., 85"></div>
                    <div class="form-group"><label for="paper-ream-rate-input">Rate per Ream (₹)</label><input
                            type="number" id="paper-ream-rate-input" placeholder="e.g., 900"></div>
                    <div class="form-group">
                        <div class="label-with-checkbox">
                            <label for="paper-cost" style="margin:0;">Paper Cost (₹)</label>
                            <div class="inline-checkbox"><input type="checkbox" id="gst-checkbox"><label
                                    for="gst-checkbox">Without GST</label></div>
                        </div>
                        <input type="number" class="cost-input" id="paper-cost" placeholder="0.00"
                            data-label="Paper Cost">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title-container">
                    <h2 class="section-title">3. Lamination</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label for="lamination-type">Lamination</label>
                        <select id="lamination-type">
                            <option value="">None</option>
                            <option value="gloss">Gloss</option>
                            <option value="matte">Matte</option>
                            <option value="thermal-gloss">Thermal Gloss</option>
                            <option value="thermal-matte">Thermal Matte</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="lami-size">Lamination Size</label>
                        <select id="lami-size">
                            <option value="">Select Size</option>
                            <option value="9X11">9X11</option>
                            <option value="9X23">9X23</option>
                            <option value="10X15">10X15</option>
                            <option value="11X18">11X18</option>
                            <option value="12X18">12X18</option>
                            <option value="12X25">12X25</option>
                            <option value="15X20">15X20</option>
                            <option value="18X23">18X23</option>
                            <option value="18X25">18X25</option>
                            <option value="19X25">19X25</option>
                            <option value="20X28">20X28</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="lami-sheets">No. of Sheets</label><input type="number"
                            id="lami-sheets" placeholder="0"></div>
                    <div class="form-group"><label for="lami-rate">Rate per Sheet (₹)</label><input type="number"
                            id="lami-rate" placeholder="0.00"></div>
                    <div class="form-group"><label for="lami-cost">Lamination Cost (₹)</label><input type="number"
                            class="cost-input" id="lami-cost" placeholder="0.00" data-label="Lamination Cost"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title-container">
                    <h2 class="section-title">4. Other Costs</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label for="binding-cost">Binding Cost (₹)</label><input type="number"
                            class="cost-input" id="binding-cost" placeholder="0.00" data-label="Binding Cost"></div>
                    <div class="form-group"><label for="other-misc-cost">Other Costs (₹)</label><input type="number"
                            class="cost-input" id="other-misc-cost" placeholder="0.00" data-label="Other Cost"></div>
                    <div class="form-group"><label for="punching-cost">Punching (₹)</label><input type="number"
                            class="cost-input" id="punching-cost" placeholder="0.00" data-label="Punching"></div>
                    <div class="form-group"><label for="clips-cost">Clips (₹)</label><input type="number"
                            class="cost-input" id="clips-cost" placeholder="0.00" data-label="Clips"></div>
                    <div class="form-group"><label for="envelope-size">Envelope Size</label><select id="envelope-size">
                            <option value="">None</option>
                            <option value="9x4">9x4</option>
                            <option value="9x5">9x5</option>
                            <option value="9x6">9x6</option>
                        </select></div>
                    <div class="form-group"><label for="env-cost">Envelope Cost (₹)</label><input type="number"
                            class="cost-input" id="env-cost" placeholder="0.00" data-label="Envelope Cost"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            const appData = {
                "paperData": [
                    { "size": "20X30", "gsm": 60, "perSheetWeight": 0.02323 },
                    { "size": "20X30", "gsm": 70, "perSheetWeight": 0.02710 },
                    { "size": "20X30", "gsm": 80, "perSheetWeight": 0.03097 },
                    { "size": "20X30", "gsm": 90, "perSheetWeight": 0.03484 },
                    { "size": "20X30", "gsm": 100, "perSheetWeight": 0.03871 },
                    { "size": "20X30", "gsm": 120, "perSheetWeight": 0.04645 }, // Added
                    { "size": "20X30", "gsm": 125, "perSheetWeight": 0.04839 }, // Added

            // --- CALCULATION FUNCTIONS ---
            // 2. Updated Grand Total Calculation Logic
            function calculateGrandTotal() {
                // Group A: Printing, Paper, Lamination
                const printing = parseFloat(printingCostInput.value) || 0;
                const second = parseFloat(secondCostInput.value) || 0;
                const paper = parseFloat(paperCostInput.value) || 0;
                const lami = parseFloat(lamiCostInput.value) || 0;
                const subtotalMultipliable = printing + second + paper + lami;

                // Group B: Other Costs
                const binding = parseFloat(bindingCostInput.value) || 0;
                const other = parseFloat(otherMiscCostInput.value) || 0;
                const punching = parseFloat(punchingCostInput.value) || 0;
                const clips = parseFloat(clipsCostInput.value) || 0;
                const env = parseFloat(envCostInput.value) || 0;
                const subtotalOther = binding + other + punching + clips + env;

                const subtotal = subtotalMultipliable + subtotalOther;

                // Apply profit margin before rounding
                const profitPercent = parseFloat(profitInput.value) || 0;
                const profitMultiplier = 1 + (profitPercent / 100);
                const subtotalWithProfit = subtotal * profitMultiplier;

                // Round subtotal with profit to nearest multiple of 50
                const roundedSubtotal = Math.ceil(subtotalWithProfit / 50) * 50;

                // Calculate tax and delivery charges
                const taxRate = taxRateCheck.checked ? 18 : 9;
                const taxVal = roundedSubtotal * (taxRate / 100);
                const deliveryCharges = parseFloat(deliveryChargesInput.value) || 0;

                const grandTotal = roundedSubtotal + taxVal + deliveryCharges;

                totalCostDisplay.textContent = `₹ ${grandTotal.toFixed(2)}`;
            }

            // --- UPDATED PRINTING COST FUNCTION (as per latest request) ---
            function calculatePrintingCosts() {
                const selectedGsm = printingGsmSelect.value;
                const selectedPlateSize = plateSizeSelect.value;

                if (!selectedGsm || !selectedPlateSize) {
                    printingCostInput.value = "";
                    secondCostInput.value = "";
                    calculateGrandTotal();
                    return;
                }

                const isWithoutPlate = withoutPlateCheck.checked;
                const isFormChecked = formCheck.checked;
                const isHeavyGsm = ['300', '350', 'DUPLEX'].includes(String(selectedGsm).toUpperCase());

                let baseCost = 0;
                let secondRate = 0;

                const smallSizes = ['10X15', '12X18'];

                // 1. DETERMINE BASE COST AND RATE (Based on Plate Size)
                if (smallSizes.includes(selectedPlateSize)) {
                    // SMALL SIZES: 1200 with plate, 700 without plate
                    baseCost = isWithoutPlate ? 700 : 1200;
                    secondRate = 300;
                } else {
                    // LARGE SIZES (e.g. 20X28)
                    if (isHeavyGsm) {
                        // Higher GSM: 2600 with plate, 1600 without plate
                        baseCost = isWithoutPlate ? 1600 : 2600;
                        secondRate = 600;
                    } else {
                        // Normal GSM: 2200 with plate, 1100 without plate
                        baseCost = isWithoutPlate ? 1100 : 2200;
                        secondRate = 500;
                    }
                }

                // 3. APPLY "FORM" MULTIPLIER
                if (isFormChecked) {
                    baseCost *= 2;
                }

                printingCostInput.value = baseCost.toFixed(2);

                const threshold = isFormChecked ? 2000 : 1000;

                let secondCost = 0;
                const effectiveQuantity = parseFloat(quantityInput.value) || 0;

                if (effectiveQuantity > threshold) {
                    secondCost = Math.ceil((effectiveQuantity - threshold) / 1000) * secondRate;
                }
                secondCostInput.value = secondCost.toFixed(2);
                calculateGrandTotal();
            }
            // --- END OF UPDATED FUNCTION ---


            function calculatePaperCost() {
                const sheets = parseFloat(paperSheetsInput.value) || 0;
                const rate = parseFloat(paperRateInput.value) || 0;

                if (!paperSizeSelect.value || !paperGsmSelect.value || !sheets || !rate) {
                    paperCostInput.value = "0.00";
                    // Trigger an input event to update the grand total
                    paperCostInput.dispatchEvent(new Event('input'));
                    return;
                }

                const paperInfo = appData.paperData?.find(d => d.size.toLowerCase() === paperSizeSelect.value.toLowerCase() && String(d.gsm).toLowerCase() === paperGsmSelect.value.toLowerCase());

                const perSheetWeight = paperInfo ? paperInfo.perSheetWeight : 0;
                if (perSheetWeight === 0) {
                    console.warn(`Missing paper data for: ${paperSizeSelect.value} @ ${paperGsmSelect.value} GSM`);
                }

                const basePrice = perSheetWeight * sheets * rate;

                // --- FIXED GST LOGIC ---
                // If "Without GST" is checked, taxRate is 0.09 (9%).
                // If it is unchecked, taxRate is 0.18 (18%).
                const taxRate = gstCheckbox.checked ? 0.09 : 0.18;
                const finalPrice = basePrice * (1 + taxRate);

                paperCostInput.value = Math.round(finalPrice).toFixed(2);
                // Trigger an input event to update the grand total
                paperCostInput.dispatchEvent(new Event('input'));
            }

            function syncPaperRates(source) {
                const paperSize = paperSizeSelect.value;
                const paperGsm = paperGsmSelect.value;
                if (!paperSize || !paperGsm) return;

                const paperInfo = appData.paperData?.find(d => d.size.toLowerCase() === paperSize.toLowerCase() && String(d.gsm).toLowerCase() === paperGsm.toLowerCase());
                const perSheetWeight = paperInfo ? paperInfo.perSheetWeight : 0;
                const reamWeight = perSheetWeight * 500;

                if (reamWeight <= 0) return;

                if (source === 'kg') {
                    const ratePerKg = parseFloat(paperRateInput.value) || 0;
                    paperReamRateInput.value = ratePerKg > 0 ? (ratePerKg * reamWeight).toFixed(2) : "";
                } else if (source === 'ream') {
                    const ratePerReam = parseFloat(paperReamRateInput.value) || 0;
                    paperRateInput.value = ratePerReam > 0 ? (ratePerReam / reamWeight).toFixed(2) : "";
                }
            }

            function calculateLaminationCost() {
                const type = laminationTypeSelect.value;
                const size = laminationSizeSelect.value;

                if (!type) {
                    lamiSheetsInput.value = "";
                    lamiRateInput.value = "";
                    lamiCostInput.value = "";
                    calculateGrandTotal();
                    return;
                }

                const upsPlateToJob = calculateUps(plateSizeSelect.value, jobSizeSelect.value);
                const baseQty = Math.ceil((parseFloat(actualQuantityInput.value) || 0) / upsPlateToJob);
                lamiSheetsInput.value = baseQty > 0 ? baseQty : "";

                let rate = 0;
                const rates = appData.laminationRates;
                if (rates && rates[type] && rates[type][size.toLowerCase()]) {
                    rate = rates[type][size.toLowerCase()];
                    lamiRateInput.value = rate.toFixed(2);
                } else {
                    rate = parseFloat(lamiRateInput.value) || 0;
                }

                const lamiSheets = parseFloat(lamiSheetsInput.value) || 0;
                const cost = lamiSheets * rate;
                lamiCostInput.value = cost > 0 ? cost.toFixed(2) : "";

                calculateGrandTotal();
            }

            function resolveDimensions(sizeStr) {
                if (!sizeStr) return "";
                const cleaned = sizeStr.trim().toUpperCase();
                const nameMap = {
                    "A3": "11.7X16.5",
                    "A4": "8.3X11.7",
                    "A5": "5.8X8.3",
                    "A6": "4.1X5.8",
                    "1/8": "5.5X8.5"
                };
                return nameMap[cleaned] || cleaned;
            }

            function calculateUps(parentSizeStr, childSizeStr) {
                if (!parentSizeStr || !childSizeStr) return 1;

                const parent = resolveDimensions(parentSizeStr).toUpperCase().split('X').map(Number);
                const child = resolveDimensions(childSizeStr).toUpperCase().split('X').map(Number);

                if (parent.length !== 2 || child.length !== 2 || parent.some(isNaN) || child.some(isNaN)) {
                    return 1;
                }

                const upsNormal = Math.floor(parent[0] / child[0]) * Math.floor(parent[1] / child[1]);
                const upsRotated = Math.floor(parent[0] / child[1]) * Math.floor(parent[1] / child[0]);

                return Math.max(1, upsNormal, upsRotated);
            }

            function calculatePaperToPlateUps(paperSizeStr, plateSizeStr) {
                const paper = paperSizeStr.toUpperCase().trim();
                const plate = plateSizeStr.toUpperCase().trim();

                // Custom override mappings for standard Indian paper-to-plate cuts
                if (paper === "23X36") {
                    if (plate === "12X18") return 4; // 23x36 cuts into exactly 4 pieces of 12x18 (technically 11.5x18)
                    if (plate === "20X28") return 1;
                }
                if (paper === "20X30") {
                    if (plate === "12X18") return 2; // 20x30 cuts into exactly 2 pieces of 12x18 (with some waste)
                    if (plate === "20X28") return 1;
                }

                // Fallback to standard geometric grid layout calculation
                return calculateUps(paper, plate);
            }

            function calculateNumberOfSheets() {
                const actualQty = parseFloat(actualQuantityInput.value) || 0;
                const paperSize = paperSizeSelect.value;
                const plateSize = plateSizeSelect.value;
                const jobSize = jobSizeSelect.value;

                if (!plateSize || !jobSize || actualQty <= 0) {
                    quantityInput.value = "";
                    paperSheetsInput.value = "";
                    calculatePaperCost();
                    return;
                }

                // 1. Calculate how many jobs fit on a plate (Ups)
                const upsPlateToJob = calculateUps(plateSize, jobSize);

                // 2. Set the Quantity (impressions) input box automatically
                const baseQuantity = Math.ceil(actualQty / upsPlateToJob);

                // If F/B Printing is checked, the actual printing quantity is impressions (sheets * 2)
                const quantity = fbCheck.checked ? baseQuantity * 2 : baseQuantity;
                quantityInput.value = quantity;

                // 3. Calculate how many plates fit on a big paper sheet
                let upsPaperToPlate = 1;
                if (paperSize) {
                    upsPaperToPlate = calculatePaperToPlateUps(paperSize, plateSize);
                }

                // 4. Calculate the required paper sheets based on baseQuantity (physical plate sheets printed, not impressions)
                const baseSheets = Math.ceil(baseQuantity / upsPaperToPlate);
                paperSheetsInput.value = baseSheets > 0 ? baseSheets + 5 : 0;

                calculatePaperCost();
            }

            function calculateAllCosts() {
                // This function now correctly calculates sheets (which in turn calculates paper cost)
                // and then calculates printing costs.
                calculateNumberOfSheets();
                calculatePrintingCosts();
                calculateLaminationCost(); // Ensure lami cost updates if dependent inputs change
            }

            function generatePDF() {
                const customerName = customerNameInput.value.trim();
                if (!customerName) {
                    alert("Please enter a customer name before creating a PDF."); return;
                }

                let counter = parseInt(localStorage.getItem(COUNTER_KEY)) || 0;

                const estimateNr = 'PCC/#' + String(counter).padStart(3, '0');

                const estimateData = {};
                allInputs.forEach(input => {

                localStorage.setItem(estimateNr, JSON.stringify(estimateData));
                localStorage.setItem(COUNTER_KEY, counter);

                const { jsPDF } = window.jspdf;

                const pdfTaxRateLabel = isGst18 ? '18%' : '0%';
                const taxVal = isGst18 ? (baseSubtotal * 0.18) : 0;
                const deliveryCharges = parseFloat(deliveryChargesInput.value) || 0;
                const finalTotal = subtotal + taxVal + deliveryCharges;

                doc.autoTable({
                    body: [
                        ['Subtotal', subtotal.toFixed(2)],
                        ['Tax Rate', pdfTaxRateLabel],
                        ['Tax', taxVal.toFixed(2)],
                        ['Delivery Charges', deliveryCharges.toFixed(2)],
                        ['TOTAL', finalTotal.toFixed(2)]
                    ],
                    startY: termsStartY,
                    margin: { left: 132 },
                    theme: 'grid',
                    styles: { fontSize: 9.5, cellPadding: 2, lineColor: [200, 200, 200] },
                    columnStyles: {
                        0: { fontStyle: 'bold', fillColor: [240, 240, 240], textColor: [60, 60, 60], cellWidth: 32, halign: 'center' },
                        1: { cellWidth: 32, halign: 'right' }
                    },
                    didParseCell: (data) => {
                        // Style the last row (TOTAL) with a stronger background and bold text
                        if (data.row.index === 4) {
                            data.cell.styles.fillColor = [210, 210, 210];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                });

                // 8. Thank You Msg
                doc.setFont("helvetica", "bolditalic");
                doc.setFontSize(11);
                doc.setTextColor(80, 80, 80);
                doc.text("Thank You For Your Business!", 105, 255, { align: 'center' });

                doc.save(`PCC/#${String(counter).padStart(3, '0')} - ${customerName}.pdf`);
                alert(`Quotation PCC/#${String(counter).padStart(3, '0')} PDF has been downloaded.`);
            }


            function showWeightCalculatorModal() {
                const modalHTML = `
                <div class="modal-overlay active">
                    <div class="modal-content">
                        <button class="modal-close" title="Close">&times;</button>
                        <h2>Paper Weight Calculator</h2>
                        <form id="paper-weight-form" class="form-grid form-grid-single-col" style="gap: 1rem;">
                            <div class="form-group">
                                <label for="calc-width">Sheet Width (inches)</label>
                                <input type="number" id="calc-width" value="23" required>
                            </div>
                            <div class="form-group">
                                <label for="calc-length">Sheet Length (inches)</label>
                                <input type="number" id="calc-length" value="36" required>
                            </div>
                            <div class="form-group">
                                <label for="calc-gsm">Paper Weight (GSM)</label>
                                <input type="number" id="calc-gsm" value="90" required>
                            </div>
                             <div class="form-group">
                                <label for="calc-sheets">Sheets per Ream</label>
                                <input type="number" id="calc-sheets" value="500" required>
                            </div>
                            <button type="submit" class.utility-btn" style="width: 100%; padding: 0.8rem; border-radius: 8px; font-size: 1rem; background: #0066cc; color: white; border: none; cursor: pointer;">Calculate</button>
                        </form>
                        <div id="weight-calculator-result" style="display: none;"></div>
                    </div>
                </div>`;
                modalContainer.innerHTML = modalHTML;

                document.getElementById('paper-weight-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const widthInches = parseFloat(document.getElementById('calc-width').value);
                    const lengthInches = parseFloat(document.getElementById('calc-length').value);
                    const gsm = parseFloat(document.getElementById('calc-gsm').value);
                    const sheets = parseInt(document.getElementById('calc-sheets').value, 10);
                    const resultDiv = document.getElementById('weight-calculator-result');

                    if (isNaN(widthInches) || isNaN(lengthInches) || isNaN(gsm) || isNaN(sheets) || widthInches <= 0 || lengthInches <= 0 || gsm <= 0 || sheets <= 0) {
                        resultDiv.innerHTML = `<p class="result-label">Error</p><p class="result-value">Invalid Input</p>`;
                    } else {
                        const widthMeters = widthInches * 0.0254;
                        const lengthMeters = lengthInches * 0.0254;
                        const areaMetersSq = widthMeters * lengthMeters;
                        const totalWeightGrams = (areaMetersSq * gsm) * sheets;
                        const totalWeightKg = totalWeightGrams / 1000;
                        resultDiv.innerHTML = `<p class="result-label">Total Ream Weight is:</p><p class="result-value">${totalWeightKg.toFixed(2)} kg</p>`;
                    }
                    resultDiv.style.display = 'block';
                });
            }

            function closeModal() { modalContainer.innerHTML = ''; }

            function populateDropdowns() {
                if (!appData.paperData) return;
                // Add more GSMs that are in the cost logic but not in paper data
                const hardcodedGsms = [170, 300, 350, 'DUPLEX'];
                let allGsm = [...new Set(appData.paperData.map(item => item.gsm))];

                hardcodedGsms.forEach(gsm => {
                    if (!allGsm.includes(gsm)) {
                        allGsm.push(gsm);
                    }
                });

                allGsm.sort((a, b) => {
                    const aIsStr = isNaN(a), bIsStr = isNaN(b);
                    if (aIsStr !== bIsStr) return aIsStr ? -1 : 1;
                    return aIsStr ? a.localeCompare(b) : a - b;
                });

                const uniqueSizes = [...new Set(appData.paperData.map(item => item.size.toUpperCase()))].sort();
                paperSizeSelect.innerHTML = '<option value="">Select Size</option>' + uniqueSizes.map(s => `<option value="${s}">${s}</option>`).join('');
                const gsmOptions = '<option value="">Select GSM</option>' + allGsm.map(g => `<option value="${g}">${g}</option>`).join('');
                printingGsmSelect.innerHTML = gsmOptions;
                paperGsmSelect.innerHTML = gsmOptions;

                // --- Job Size and Plate Size Dropdowns ---
                const currentJobSizes = [
                    "A3", "A4", "A5", "A6", "1/8",
                    "9X11", "9X23", "10X15", "11X17", "11X18", "12X17", "12X18", "12X25",
                    "15X20", "18X23", "18X25", "19X25", "20X28"
                ];
                const currentPlateSizes = ["12X18", "20X28"];

                let jobSizeHTML = '<option value="">Select Size</option>';
                jobSizeHTML += currentJobSizes.map(s => `<option value="${s}">${s}</option>`).join('');
                jobSizeSelect.innerHTML = jobSizeHTML;

                let plateSizeHTML = '<option value="">Select Size</option>';
                plateSizeHTML += currentPlateSizes.map(s => `<option value="${s}">${s}</option>`).join('');
                plateSizeSelect.innerHTML = plateSizeHTML;
            }

            function setupEventListeners() {
                modalContainer.addEventListener('click', (e) => {
                    if (e.target.matches('.modal-overlay, .modal-close')) closeModal();
                });

                downloadPdfBtn.addEventListener('click', generatePDF);
                copyQuotationBtn.addEventListener('click', copyQuotation);
                whatsappBtn.addEventListener('click', sendToWhatsApp);
                openWeightCalculatorBtn.addEventListener('click', showWeightCalculatorModal);

                // Grand total listener
                allCostInputs.forEach(input => input.addEventListener('input', calculateGrandTotal));

                // Listeners that trigger main calculations
                [plateSizeSelect, jobSizeSelect, actualQuantityInput, quantityInput, fbCheck, formCheck, withoutPlateCheck, printingGsmSelect, paperSizeSelect, paperGsmSelect].forEach(el => {
                    el.addEventListener('change', calculateAllCosts);
                    el.addEventListener('input', calculateAllCosts);
                });

                // Listeners that *only* trigger paper cost calculation
                [paperRateInput, paperReamRateInput, gstCheckbox].forEach(el => {
                    el.addEventListener('change', calculatePaperCost);
                    el.addEventListener('input', calculatePaperCost);
                });

                // Add listeners for new lamination inputs
                [laminationTypeSelect, laminationSizeSelect, lamiSheetsInput, lamiRateInput].forEach(el => {
                    el.addEventListener('change', calculateLaminationCost); // Specific calc first
                    el.addEventListener('input', calculateLaminationCost);
                });

                // Specific event listeners for bidirectional rate syncing
                paperRateInput.addEventListener('input', () => syncPaperRates('kg'));
                paperRateInput.addEventListener('change', () => syncPaperRates('kg'));
                paperReamRateInput.addEventListener('input', () => syncPaperRates('ream'));
                paperReamRateInput.addEventListener('change', () => syncPaperRates('ream'));

                // Sync ream rates when paper specs change
                [paperSizeSelect, paperGsmSelect].forEach(el => {
                    el.addEventListener('change', () => syncPaperRates('kg'));
                });



                printingGsmSelect.addEventListener('change', () => syncGsm(printingGsmSelect, paperGsmSelect));
                paperGsmSelect.addEventListener('change', () => syncGsm(paperGsmSelect, printingGsmSelect));

                // Listeners that only trigger grand total calculation
                [taxRateCheck, deliveryChargesInput, profitInput].forEach(el => {
                    el.addEventListener('change', calculateGrandTotal);
                    el.addEventListener('input', calculateGrandTotal);
                });
            }
        });
    </script>
